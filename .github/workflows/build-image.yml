# Build the forgery-segmentation training image and push it to ECR.
#
# Tags pushed: the 12-char commit SHA always, plus `latest` on the default
# branch and whatever you type into the image_tag input. Pin real runs to the SHA.
name: Build training image

# Manual only — nothing that touches AWS runs on push.
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Extra tag to push (the commit SHA is always pushed too)"
        required: false
        default: ""

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: forgery-train
  DLC_ACCOUNT: "763104351884"     # AWS's Deep Learning Container account
  DLC_REGION: us-east-1

permissions:
  contents: read
  id-token: write                 # OIDC: required to assume the AWS role

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # the CUDA DLC unpacks to ~20 GB; a stock runner has ~14 GB free on /
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc "$AGENT_TOOLSDIRECTORY" || true
          df -h /

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to our ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Log in to the AWS DLC registry (the base image)
        run: |
          aws ecr get-login-password --region "$DLC_REGION" \
            | docker login --username AWS --password-stdin \
                "${DLC_ACCOUNT}.dkr.ecr.${DLC_REGION}.amazonaws.com"

      - name: Create the ECR repository if it doesn't exist
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" --region "$AWS_REGION" \
            || aws ecr create-repository --repository-name "$ECR_REPOSITORY" --region "$AWS_REGION" \
                 --image-scanning-configuration scanOnPush=true

      - name: Assemble tags
        id: meta
        env:
          EXTRA_TAG: ${{ inputs.image_tag }}
          DEFAULT_REF: refs/heads/${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          REPO="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}"
          SHA_TAG="$(git rev-parse --short=12 HEAD)"
          TAGS="${REPO}:${SHA_TAG}"
          if [[ "$GITHUB_REF" == "$DEFAULT_REF" ]]; then TAGS="${TAGS},${REPO}:latest"; fi
          if [[ -n "$EXTRA_TAG" ]]; then TAGS="${TAGS},${REPO}:${EXTRA_TAG}"; fi
          {
            echo "tags=${TAGS}"
            echo "image_uri=${REPO}:${SHA_TAG}"
            echo "sha_tag=${SHA_TAG}"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: sagemaker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: false       # SageMaker rejects OCI attestation manifests
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Pushed"
            echo '```'
            echo "${{ steps.meta.outputs.image_uri }}"
            echo '```'
            echo "Use image tag \`${{ steps.meta.outputs.sha_tag }}\` in **Smoke test** and **Run training**."
          } >> "$GITHUB_STEP_SUMMARY"
