
# ============================================================
# General settings
# ============================================================

name: train_forensics_v1
model: dinov3_forensics_lora
type: binary_segmentation
data_context: normal


# ============================================================
# Datasets
# ============================================================

datasets:

  # NOTE: train and test currently point at the same CASIA v2 sample
  # set (D:/ForensicsSAM-main/forensics_datasets/CASIAV2_processed,
  # images/<name>.jpg + masks/<name>.png pairs) for pipeline validation
  # only — this is not a held-out split. Replace with a real train/test
  # split before a real training run.

  train:
    dataroot: "D:/ForensicsSAM-main/forensics_datasets/CASIAV2_processed"
    n_workers: 4
    batch_size: 4
    crop_size: 512
    buffer_size: 1000
    total_samples: null
    stateful_loader: true
    pin_memory: true

  test:
    dataroot: "D:/ForensicsSAM-main/forensics_datasets/CASIAV2_processed"
    n_workers: 2
    crop_size: 512
    pin_memory: true


# ============================================================
# Network structure
# ============================================================

structure:

  backbone:
    model_path: ../../artifacts/mirror/dinov3-vitl16
    model_type: dinov3_vitl16
    lora_rank: 32
    lora_alpha: 64
    lora_dropout: 0.0


# ============================================================
# Pretraining settings
# ============================================================

pretraining_settings:

  want_load: false
  checkpoint_path: ""
  strict_load: true


# ============================================================
# Epoch settings
# ============================================================

epoch_settings:

  total_epochs: 10


# ============================================================
# Training settings
# ============================================================

train_settings:

  # ----------------------------------------------------------
  # Optimizer
  # ----------------------------------------------------------

  base_lr: !!float 5e-4
  weight_decay: !!float 0.05
  layer_decay: 0.8


  # ----------------------------------------------------------
  # Scheduler
  # ----------------------------------------------------------

  scheduler_type: annealing
  warmup_epochs: 0.05
  warmup_lr: !!float 2.5e-7
  min_lr: !!float 1e-5
  T_0_epochs: 2


  # ----------------------------------------------------------
  # Criterion
  # ----------------------------------------------------------

  criterion: forgery_segmentation

  forgery_segmentation_loss:
    edge_lambda: 20.0


  # ----------------------------------------------------------
  # Training mechanics
  # ----------------------------------------------------------

  grad_accum_steps: 8
  grad_clip: 1.0

  save_interval: 5000
  log_interval: 100

  mixed_precision: true


  # ----------------------------------------------------------
  # Checkpointing
  # ----------------------------------------------------------

  save_checkpoint_folder_path: ../../checkpoints

  load_checkpoint_file_path:

  resume_dataloader: true


# ============================================================
# Evaluation settings
# ============================================================
#
# Consumed by authgenforge/evals/evaluator.py's evaluate_from_yml().
# Independent of train_settings.load_checkpoint_file_path (that one
# resumes training; this is "which weights to evaluate" — typically
# the <name>_best.pth written during training).

eval_settings:

  checkpoint_path: ../../checkpoints/train_forensics_v1/train_forensics_v1_best.pth

  image_size: 512
  threshold: 0.5
  batch_size: 4
  num_workers: 4
  half_precision: true

  output_dir: