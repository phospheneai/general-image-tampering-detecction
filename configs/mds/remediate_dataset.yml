#### packages/mdsconverter/remediate_dataset.py config — stage 2.
#### Dry-run by default regardless of what's below — pass --execute (or set
#### stages.remediate.execute / answer "y" in pipeline.yml's interactive
#### gate) to actually move anything:
####   python packages/mdsconverter/remediate_dataset.py --config configs/mds/remediate_dataset.yml            # dry run
####   python packages/mdsconverter/remediate_dataset.py --config configs/mds/remediate_dataset.yml --execute   # for real

# validate_dataset.yml's report_out.
report: /home/ubuntu/data/logs/validation_report.csv

# move -> <quarantine_dir>/<split>/<dataset>/<label>/<file> (+ mask/),
#         reversible by hand if a failure was a false positive. Never
#         overwrites an existing file there.
# Never `delete` here: raw/ is the only local copy of the Glacier restore.
action: move
quarantine_dir: /home/ubuntu/data/quarantine

# Only act on these failure kinds (null = all). missing-mask is left out
# on purpose: a whole dataset "missing" masks is usually a naming mismatch —
# fix mask_suffixes: in datasets.yml instead of quarantining good images.
reasons:
  - unreadable
  - image-decode-invalid
  - mask-decode-invalid
  - mask-size-mismatch
  - empty-mask
