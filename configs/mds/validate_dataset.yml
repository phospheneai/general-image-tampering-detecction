#### packages/mdsconverter/validate_dataset.py config — stage 1.
####
####   python packages/mdsconverter/validate_dataset.py --config configs/mds/validate_dataset.yml
####
#### Decodes every image (and every tampered image's mask) under the
#### datasets in datasets.yml and writes one row per image to report_out
#### (status=ok/failed + reason). Touches nothing on disk.

datasets_config: datasets.yml

report_out: /home/ubuntu/data/logs/validation_report.csv

# nproc (4) minus 2, leaving headroom for the OS and the tmux session.
num_workers: 2
chunksize: 16

# Reject tampered samples whose mask marks no pixels (would train as a
# false "authentic").
check_mask_content: true
