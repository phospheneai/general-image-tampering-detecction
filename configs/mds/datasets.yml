#### Shared dataset list for the forensics MDS pipeline — the ONE place to
#### say where the raw datasets live and which split each belongs to.
#### validate_dataset.yml and mds_dataset.yml both point here via
#### `datasets_config: datasets.yml`, so the two stages can never disagree.
####
#### Expected layout per dataset (see MDS_DATASET.md):
####   <data_root>/<name>/images/authentic/<file>
####   <data_root>/<name>/images/tampered/<file>
####   <data_root>/<name>/masks/tampered/<file>      (mask/ also accepted)

# Folder holding one subfolder per train dataset (local copy of
# s3://authenta-general-image-forgery-dataset/dataset-v1/train/).
data_root: /home/ubuntu/data/raw/train

# <key>: train | test | skip, or {split: ..., path: ...} for a dataset that
# doesn't live at <data_root>/<key>. Bare keys must match the folder names
# on disk exactly. The stored `dataset` column is the folder's own name
# (COCO2017_test below is stored as dataset=COCO2017, split=test).
datasets:
  # ---- train (raw/train) ----
  CASIA_v1: train
  CASIA_v2: train
  COCO2017: train                 # authentic only (train2017)
  FantasticReality: train
  LAION-Mobile: train             # authentic only
  MISD: train
  tampCOCO: train                 # tampered only
  # raw/train/compRAISE only holds zips — extracted outside raw/ by
  # packages/mdsconverter/prepare_compraise.py. Authentic only.
  compRAISE: {split: train, path: /home/ubuntu/data/extracted/compRAISE}

  # ---- test (raw/test) ----
  COCO2017_test: {split: test, path: /home/ubuntu/data/raw/test/COCO2017}   # authentic only (val2017)
  DEFACTO: {split: test, path: /home/ubuntu/data/raw/test/DEFACTO}          # tampered only
  IMD2020: {split: test, path: /home/ubuntu/data/raw/test/IMD2020}          # masks are <stem>_mask.png
  In-the-Wild: {split: test, path: /home/ubuntu/data/raw/test/In-the-Wild}  # tampered only
  RTD: {split: test, path: /home/ubuntu/data/raw/test/RTD}                  # "Realistic Tampering" (Korus)
  cocoglide: {split: test, path: /home/ubuntu/data/raw/test/cocoglide}
  # columbia's ground truth is "raw masks"/tampered/<stem>_edgemask.jpg
  # (RGB camera-region maps) — converted outside raw/ by
  # packages/mdsconverter/prepare_columbia.py into binary masks (bright red =
  # camera 1 near the splicing boundary = tampered), images copied as-is.
  columbia: {split: test, path: /home/ubuntu/data/extracted/columbia}

# Stem suffixes tried in order when pairing images/tampered/<stem>.* with
# masks/tampered/<stem><suffix>.* — "" (exact stem) first. Checked against
# every dataset above: all pair on "" except IMD2020 ("_mask").
mask_suffixes: ["", "_mask"]

# Uncomment to override the default extension lists:
# image_exts: [.jpg, .jpeg, .png, .tif, .tiff, .bmp, .webp]
# mask_exts: [.png, .bmp, .tif, .tiff, .jpg, .jpeg, .gif]
