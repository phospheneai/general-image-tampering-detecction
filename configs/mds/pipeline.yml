#### packages/mdsconverter/run_pipeline.py config — validate -> remediate ->
#### convert as one run. Each stage runs only if enabled: true; --only /
#### --skip on the command line override that for a one-off run.
####
####   python packages/mdsconverter/run_pipeline.py --config configs/mds/pipeline.yml
####   python packages/mdsconverter/run_pipeline.py --config configs/mds/pipeline.yml --only validate
####
#### config: paths are relative to this file's directory (configs/mds/).

stages:
  # validate + remediate off, like the reference repo's pipeline.yml: the
  # raw dataset was decode-checked before it was uploaded to S3, and Step 1
  # confirmed the local copy is byte-for-byte what's in S3. Turn back on
  # for any newly ingested source.
  validate:
    enabled: false
    config: validate_dataset.yml
    # split: train   # optional, restrict to one split

  remediate:
    enabled: false
    config: remediate_dataset.yml
    # If validate found failures, stop and ask y/n before remediate +
    # convert run. Zero failures -> no prompt, proceeds straight through.
    interactive: true
    execute: false

  convert:
    enabled: true
    config: mds_dataset.yml
    # split: train
